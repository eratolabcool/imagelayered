name: Studio P0 CI

on:
  push:
    branches:
      - feat/layer-studio-p0
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/features/studio/**'
      - 'src/shared/models/studio.ts'
      - 'src/config/db/schema*.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/studio-p0-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_DEFAULT_LOCALE: en
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:/tmp/image-layered-ci.db
          AUTH_SECRET: studio-p0-ci-only-secret
